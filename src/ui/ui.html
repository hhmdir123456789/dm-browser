<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    font-size: 13px;
    user-select: none;
    background: #dce1e6;
  }

  .tabbar {
    display: flex;
    align-items: center;
    height: 40px;
    padding: 0 8px;
    background: #dce1e6;
    gap: 4px;
  }
  .tabs {
    display: flex;
    gap: 4px;
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    height: 32px;
    border-radius: 8px 8px 0 0;
    background: transparent;
    color: #333;
    cursor: pointer;
    transition: background 0.15s;
    flex: 0 1 220px;
    min-width: 100px;
    max-width: 220px;
    position: relative;
  }
  .tab:hover { background: rgba(255,255,255,0.5); }
  .tab.active {
    background: #f5f7fa;
    color: #000;
    box-shadow: 0 -1px 2px rgba(0,0,0,0.05);
  }
  .tab .favicon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #4a90e2, #7b2ff7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #fff;
    font-weight: bold;
  }
  .tab .title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab .close {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
    color: #666;
    flex-shrink: 0;
  }
  .tab:hover .close,
  .tab.active .close { display: flex; }
  .tab .close:hover { background: rgba(0,0,0,0.1); color: #000; }

  .new-tab {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #555;
    cursor: pointer;
    flex-shrink: 0;
    margin-left: 4px;
  }
  .new-tab:hover { background: rgba(255,255,255,0.5); }

  .toolbar {
    display: flex;
    align-items: center;
    height: 48px;
    padding: 0 12px;
    background: #f5f7fa;
    gap: 8px;
  }
  .btn {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #444;
    cursor: pointer;
    flex-shrink: 0;
    font-size: 16px;
  }
  .btn:hover { background: rgba(0,0,0,0.06); }
  .btn:disabled { color: #bbb; cursor: default; }
  .btn:disabled:hover { background: transparent; }

  .addr-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    height: 34px;
    padding: 0 10px;
    background: #fff;
    border-radius: 17px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    gap: 6px;
  }
  .addr-wrap:focus-within {
    box-shadow: 0 0 0 2px rgba(0,120,212,0.3), 0 1px 2px rgba(0,0,0,0.08);
  }
  .addr-wrap .lock {
    font-size: 13px;
    color: #666;
    flex-shrink: 0;
  }
  .addr-wrap input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 13px;
    color: #222;
    background: transparent;
    font-family: inherit;
  }
  .addr-wrap .icon-right {
    font-size: 14px;
    color: #666;
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
  }
  .addr-wrap .icon-right:hover { background: rgba(0,0,0,0.06); }
</style>
</head>
<body>
  <div class="tabbar" id="tabbar">
    <div class="tabs" id="tabs"></div>
    <div class="new-tab" id="newTab">+</div>
  </div>

  <div class="toolbar">
    <div class="btn" id="btnBack" title="后退">←</div>
    <div class="btn" id="btnForward" title="前进">→</div>
    <div class="btn" id="btnReload" title="刷新">↻</div>
    <div class="btn" id="btnHome" title="主页">⌂</div>

    <div class="addr-wrap">
      <span class="lock" id="lockIcon">📄</span>
      <input id="addrInput" type="text" placeholder="搜索或输入网址" />
      <span class="icon-right" id="btnStar" title="收藏">☆</span>
      <span class="icon-right" title="更多">⋯</span>
    </div>

    <div class="btn" title="设置">⚙</div>
  </div>

  <script>
    let tabs = [];
    let activeId = 0;
    let userEditing = false;

    function send(msg) {
      console.log('[UI] send: ' + JSON.stringify(msg));
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(JSON.stringify(msg));
      }
    }

    function renderTabs() {
      const container = document.getElementById('tabs');
      if (!container) return;
      container.innerHTML = '';
      for (const t of tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (t.id === activeId ? ' active' : '');
        el.title = t.url || '';

        const fav = document.createElement('div');
        fav.className = 'favicon';
        fav.textContent = (t.title || '?')[0];
        el.appendChild(fav);

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = t.title || '新标签页';
        el.appendChild(title);

        const close = document.createElement('div');
        close.className = 'close';
        close.textContent = '×';
        el.appendChild(close);

        el.addEventListener('click', (e) => {
          if (e.target === close) {
            send({ type: 'closeTab', id: t.id });
          } else {
            send({ type: 'activateTab', id: t.id });
          }
        });
        container.appendChild(el);
      }
    }

    const addrInput = document.getElementById('addrInput');
    if (addrInput) {
      addrInput.addEventListener('focus', () => {
        userEditing = true;
        addrInput.select();
      });
      addrInput.addEventListener('blur', () => {
        userEditing = false;
      });
      addrInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          send({ type: 'navigate', url: addrInput.value.trim() });
          addrInput.blur();
        }
        if (e.key === 'Escape') {
          addrInput.blur();
        }
        if (e.key === 'a' && e.ctrlKey) {
          addrInput.select();
        }
      });
    }

    const btnNewTab = document.getElementById('newTab');
    if (btnNewTab) btnNewTab.onclick = () => send({ type: 'newTab' });

    const btnBack = document.getElementById('btnBack');
    if (btnBack) btnBack.onclick = () => send({ type: 'back' });

    const btnForward = document.getElementById('btnForward');
    if (btnForward) btnForward.onclick = () => send({ type: 'forward' });

    const btnReload = document.getElementById('btnReload');
    if (btnReload) btnReload.onclick = () => send({ type: 'reload' });

    const btnHome = document.getElementById('btnHome');
    if (btnHome) btnHome.onclick = () => send({ type: 'home' });

    const btnStar = document.getElementById('btnStar');
    if (btnStar) btnStar.onclick = () => send({ type: 'star' });

    const tabbarEl = document.getElementById('tabbar');
    if (tabbarEl) {
      tabbarEl.addEventListener('dblclick', (e) => {
        if (e.target === tabbarEl ||
            e.target.classList.contains('tabs')) {
          send({ type: 'newTab' });
        }
      });
    }

    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', (e) => {
        const msg = e.data;
        if (msg.type === 'updateTabs') {
          tabs = msg.tabs;
          activeId = msg.activeId;
          renderTabs();
        }
        if (msg.type === 'updateAddress') {
          if (!userEditing && addrInput) {
            addrInput.value = msg.url || '';
          }
        }
        if (msg.type === 'updateNavState') {
          const b = document.getElementById('btnBack');
          const f = document.getElementById('btnForward');
          if (b) b.disabled = !msg.canBack;
          if (f) f.disabled = !msg.canForward;
        }
        if (msg.type === 'updateLock') {
          const lock = document.getElementById('lockIcon');
          if (lock) lock.textContent = msg.icon;
        }
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      send({ type: 'uiReady' });
    });
  </script>
</body>
</html>
