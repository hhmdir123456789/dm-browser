<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden;
    font-family:"Microsoft YaHei","Segoe UI",sans-serif;
    font-size:13px;
    background:#f5f7fa; color:#333;
    user-select:none;
  }
  body { display:flex; flex-direction:column; }

  .header {
    display:flex; align-items:center; height:40px;
    padding:0 8px; background:#e8ecf0;
    gap:4px; border-bottom:1px solid #d0d5dc;
    flex-shrink:0;
  }
  .header .tab {
    padding:6px 12px; border-radius:6px; cursor:pointer;
    color:#666; font-size:12px;
  }
  .header .tab:hover { background:#dce1e6; color:#222; }
  .header .tab.active { background:#fff; color:#000; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
  .header .close {
    margin-left:auto; padding:4px 10px; border-radius:6px;
    cursor:pointer; color:#888; font-size:16px; line-height:1;
  }
  .header .close:hover { background:#e74c3c; color:#fff; }

  .status {
    font-size:11px; color:#888; padding:4px 12px;
    background:#e8ecf0; border-bottom:1px solid #d0d5dc;
    flex-shrink:0;
  }
  .status.ok { color:#2e8b57; }
  .status.err { color:#c0392b; }

  .settings-bar {
    padding:4px 12px; background:#e8ecf0;
    display:flex; align-items:center; gap:8px;
    border-bottom:1px solid #d0d5dc; flex-shrink:0;
  }
  .settings-bar select, .settings-bar input {
    background:#fff; border:1px solid #d0d5dc;
    border-radius:4px; padding:3px 6px; color:#333;
    font-size:11px; font-family:inherit;
  }
  .settings-bar label { font-size:11px; color:#888; }
  .settings-bar button {
    padding:3px 8px; background:#fff; border:1px solid #d0d5dc;
    color:#333; border-radius:4px; cursor:pointer; font-size:11px;
  }
  .settings-bar button:hover { background:#f0f4f8; }

  .panel {
    display:none;
    flex: 1;
    flex-direction: column;
    min-height: 0;
  }
  .panel.active { display:flex; }

  .chat { flex:1; overflow-y:auto; padding:12px; min-height:0; }
  .msg {
    margin-bottom:12px; padding:8px 12px; border-radius:8px;
    white-space:pre-wrap; word-wrap:break-word;
    line-height:1.6; font-size:12px;
  }
  .msg.user { background:#e1e5eb; margin-left:15%; color:#222; }
  .msg.assistant { background:#fff; margin-right:15%; color:#222;
                   border:1px solid #e0e4ea; }
  .msg.error { background:#fdecea; color:#c0392b;
               border:1px solid #f5c6cb; font-size:11px; }

  .chat-input-bar {
    display:flex; padding:8px; gap:8px;
    background:#e8ecf0; border-top:1px solid #d0d5dc;
    flex-shrink:0;
  }
  .chat-input-bar input {
    flex:1; background:#fff; border:1px solid #d0d5dc; outline:none;
    border-radius:8px; padding:8px 12px; color:#333;
    font-size:13px; font-family:inherit;
  }
  .chat-input-bar input:focus { border-color:#4a90e2;
                                box-shadow:0 0 0 2px rgba(74,144,226,0.15); }
  .chat-input-bar button {
    padding:0 16px; background:#4a90e2; border:none;
    border-radius:8px; color:#fff; font-weight:bold;
    cursor:pointer; font-size:13px;
  }
  .chat-input-bar button:hover { background:#3a7bc8; }

  .list { padding:8px; flex:1; overflow-y:auto; min-height:0; }
  .list-item {
    padding:10px 12px; border-radius:6px; cursor:pointer;
    margin-bottom:4px; border-left:3px solid transparent;
    background:#fff;
  }
  .list-item:hover { background:#f0f4f8; border-left-color:#4a90e2; }
  .list-item .title {
    color:#222; font-size:12px; margin-bottom:3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .list-item .url {
    color:#888; font-size:10px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .empty {
    padding:40px 20px; text-align:center;
    color:#999; font-size:12px;
  }
  .empty .hint {
    font-size:11px; color:#bbb; margin-top:8px; display:block;
  }

  /* ===== 分析面板 ===== */
  .analyze-body {
    flex:1; overflow-y:auto; padding:12px; min-height:0;
  }
  .analyze-toolbar {
    display:flex; gap:6px; margin-bottom:12px;
  }
  .analyze-toolbar button {
    flex:1; padding:8px 12px; background:#4a90e2; border:none;
    border-radius:6px; color:#fff; font-weight:bold; cursor:pointer;
    font-size:12px; font-family:inherit;
  }
  .analyze-toolbar button:hover { background:#3a7bc8; }
  .analyze-toolbar button.sec {
    background:#fff; color:#333; border:1px solid #d0d5dc;
  }
  .analyze-toolbar button.sec:hover { background:#f0f4f8; }
  .analyze-toolbar button:disabled {
    background:#ccc; cursor:not-allowed;
  }

  .section-title {
    font-size:11px; color:#888; margin:14px 0 6px;
    text-transform:uppercase; letter-spacing:0.5px;
  }
  .section-title:first-child { margin-top:0; }

  .scores { display:flex; flex-direction:column; gap:8px; }
  .score-row {
    display:flex; align-items:center; gap:8px;
    background:#fff; padding:8px 10px; border-radius:6px;
    border:1px solid #e0e4ea;
  }
  .score-row .label {
    font-size:11px; color:#666; width:60px; flex-shrink:0;
  }
  .score-row .bar {
    flex:1; height:8px; background:#eef1f4;
    border-radius:4px; overflow:hidden;
  }
  .score-row .bar .fill {
    height:100%; background:#4a90e2; border-radius:4px;
    transition:width 0.3s ease;
  }
  .score-row .bar .fill.good { background:#2ecc71; }
  .score-row .bar .fill.warn { background:#f39c12; }
  .score-row .bar .fill.bad  { background:#e74c3c; }
  .score-row .value {
    font-size:11px; color:#333; width:44px; text-align:right;
    font-variant-numeric:tabular-nums;
  }

  .diff-item {
    background:#fff; border:1px solid #e0e4ea;
    border-radius:6px; padding:8px 10px; margin-bottom:6px;
    border-left:3px solid #f39c12;
    cursor:pointer; transition: box-shadow 0.15s ease;
  }
  .diff-item:hover {
    box-shadow: 0 0 0 2px rgba(74,144,226,0.25);
  }
  .diff-item.sev-high   { border-left-color:#e74c3c; }
  .diff-item.sev-mid    { border-left-color:#f39c12; }
  .diff-item.sev-low    { border-left-color:#95a5a6; }
  .diff-item .head {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:4px;
  }
  .diff-item .dim {
    font-size:11px; color:#4a90e2; font-weight:bold;
  }
  .diff-item .sev {
    font-size:10px; color:#fff; padding:1px 6px; border-radius:8px;
    background:#f39c12;
  }
  .diff-item.sev-high .sev { background:#e74c3c; }
  .diff-item.sev-low  .sev { background:#95a5a6; }
  .diff-item .path {
    font-size:10px; color:#888; font-family:Consolas,monospace;
    margin-bottom:4px; word-break:break-all;
  }
  .diff-item .change {
    font-size:11px; color:#333; font-family:Consolas,monospace;
  }
  .diff-item .change .old { color:#c0392b; }
  .diff-item .change .new { color:#2e8b57; }

  .feat-item {
    display:flex; align-items:center; gap:8px;
    background:#fff; padding:6px 10px; border-radius:6px;
    margin-bottom:4px; border:1px solid #e0e4ea;
  }
  .feat-item .name {
    flex:1; font-size:11px; color:#333;
    font-family:Consolas,monospace;
  }
  .feat-item .stat {
    font-size:10px; color:#888;
  }
  .feat-item .priority {
    font-size:10px; color:#fff; background:#e74c3c;
    padding:1px 6px; border-radius:8px;
  }
  .feat-item .priority.zero { background:#95a5a6; }

  /* 保存参考成功提示 */
  .saved-tip {
    background:#eaf7ee; border:1px solid #b7e1c4;
    color:#2e8b57; padding:14px; border-radius:6px;
    text-align:center; font-size:12px;
  }
  .saved-tip .icon { font-size:22px; display:block; margin-bottom:6px; }
  .saved-tip .hint {
    font-size:11px; color:#7aab89; margin-top:8px; display:block;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="tab active" data-tab="ai">AI 助手</div>
    <div class="tab" data-tab="analyze">分析</div>
    <div class="tab" data-tab="privacy">隐私</div>
    <div class="tab" data-tab="history">历史</div>
    <div class="close" id="closeBtn">×</div>
  </div>

  <div class="status" id="status">Ollama: 检测中...</div>

  <div class="settings-bar">
    <label>模型</label>
    <select id="modelSelect">
      <option value="qwen2.5:7b">qwen2.5:7b</option>
    </select>
    <button id="refreshBtn">检测</button>
  </div>

  <div class="panel active" id="panel-ai">
    <div class="chat" id="chat"></div>
    <div class="chat-input-bar">
      <input id="chatInput" type="text" placeholder="问点什么... (Enter 发送)" />
      <button id="chatSend">发送</button>
    </div>
  </div>

  <div class="panel" id="panel-analyze">
    <div class="analyze-body">
      <div class="analyze-toolbar">
        <button id="analyzeBtn">分析本页</button>
        <button id="featuresBtn" class="sec">特性排行</button>
      </div>
      <div id="analyzeResult">
        <div class="empty">
          点「分析本页」采集当前页面快照
          <span class="hint">首次会保存为参考，再次分析则对比差异</span>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-privacy">
    <div class="list" id="privacyList">
      <div class="empty">
        暂无审计记录
        <span class="hint">隐私仪表板开发中</span>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-history">
    <div class="list" id="historyList">
      <div class="empty">暂无历史记录</div>
    </div>
  </div>

<script>
  const $ = id => document.getElementById(id);
  let chatHistory = [];
  let aiChunks = {};

  function send(msg) {
    console.log('[Sidebar] send:', JSON.stringify(msg));
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify(msg));
    }
  }

  // ===== 关闭按钮 =====
  $('closeBtn').onclick = () => {
    send({ type: 'toggleSidebar', open: false });
  };

  // ===== 标签切换 =====
  if (!window._tabBound) {
    window._tabBound = true;
    document.querySelectorAll('.header .tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.header .tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        $('panel-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'privacy') send({ type: 'loadAudit' });
        if (tab.dataset.tab === 'history') send({ type: 'loadHistory' });
        if (tab.dataset.tab === 'analyze') send({ type: 'loadFeatures' });
      };
    });
  }

  // ===== 模型选择 =====
  const modelSelect = $('modelSelect');
  const savedModel = localStorage.getItem('ollamaModel');
  if (savedModel) {
    let found = false;
    for (const opt of modelSelect.options) {
      if (opt.value === savedModel) { found = true; break; }
    }
    if (!found) {
      const opt = document.createElement('option');
      opt.value = savedModel;
      opt.textContent = savedModel;
      modelSelect.appendChild(opt);
    }
    modelSelect.value = savedModel;
  }
  modelSelect.onchange = () => {
    localStorage.setItem('ollamaModel', modelSelect.value);
  };

  $('refreshBtn').onclick = () => {
    send({ type: 'checkOllama' });
  };

  // ===== AI 对话 =====
  const chatEl = $('chat');

  function appendChat(role, content) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = content;
    chatEl.appendChild(el);
    chatEl.scrollTop = chatEl.scrollHeight;
    return el;
  }

  function sendChat() {
    const input = $('chatInput');
    const text = input.value.trim();
    if (!text) return;
    appendChat('user', text);
    chatHistory.push({ role: 'user', content: text });
    input.value = '';

    const requestId = 'req-' + Date.now();
    const el = appendChat('assistant', '');
    aiChunks[requestId] = (chunk) => {
      if (chunk === null) { delete aiChunks[requestId]; return; }
      el.textContent += chunk;
      chatEl.scrollTop = chatEl.scrollHeight;
    };

    send({
      type: 'aiChat',
      requestId: requestId,
      endpoint: localStorage.getItem('ollamaEndpoint') || 'http://localhost:11434',
      model: modelSelect.value || 'qwen2.5:7b',
      history: chatHistory.slice(-10),
      message: text
    });
  }

  $('chatSend').onclick = sendChat;
  $('chatInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendChat();
  });

  // ===== 分析面板 =====
  const analyzeBtn = $('analyzeBtn');
  const featuresBtn = $('featuresBtn');
  const analyzeResult = $('analyzeResult');

  analyzeBtn.onclick = () => {
    analyzeBtn.disabled = true;
    analyzeBtn.textContent = '采集中...';
    analyzeResult.innerHTML =
      '<div class="empty">正在采集页面快照...<span class="hint">大页面可能需要几秒</span></div>';
    send({ type: 'analyzePage' });
  };

  featuresBtn.onclick = () => {
    analyzeResult.innerHTML = '<div class="empty">加载特性排行...</div>';
    send({ type: 'loadFeatures' });
  };

  // ===== 批 4B-3：点差异条目高亮对应 DOM 节点 =====
  analyzeResult.addEventListener('click', (e) => {
    const item = e.target.closest('.diff-item');
    if (!item) return;
    const path = item.getAttribute('data-path');
    if (path) send({ type: 'highlightDiff', path: path });
  });

  function scoreClass(v) {
    if (v >= 0.9) return 'good';
    if (v >= 0.6) return 'warn';
    return 'bad';
  }

  function renderAnalyzeResult(msg) {
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = '分析本页';

    const r = msg.result;
    if (!r) {
      analyzeResult.innerHTML = '<div class="empty">无结果</div>';
      return;
    }

    let html = '';

    // 相似度
    html += '<div class="section-title">相似度</div>';
    html += '<div class="scores">';
    const scores = [
      ['结构', r.structuralScore],
      ['样式', r.styleScore],
      ['布局', r.layoutScore]
    ];
    for (const [label, v] of scores) {
      const pct = Math.round(v * 100);
      html += '<div class="score-row">' +
        '<span class="label">' + label + '</span>' +
        '<span class="bar"><span class="fill ' + scoreClass(v) +
          '" style="width:' + pct + '%"></span></span>' +
        '<span class="value">' + pct + '%</span>' +
      '</div>';
    }
    html += '</div>';

    // 差异
    const diffs = r.diffs || [];
    html += '<div class="section-title">差异 (' + diffs.length + ')</div>';
    if (!diffs.length) {
      html += '<div class="empty">无差异 🎉</div>';
    } else {
      const sorted = diffs.slice().sort((a, b) => b.severity - a.severity);
      for (const d of sorted.slice(0, 30)) {
        const sev = d.severity >= 5 ? 'sev-high'
                  : d.severity >= 3 ? 'sev-mid' : 'sev-low';
        html += '<div class="diff-item ' + sev + '" data-path="' + esc(d.path) + '">' +
          '<div class="head">' +
            '<span class="dim">' + esc(d.dimension) + ' / ' + esc(d.category) + '</span>' +
            '<span class="sev">' + d.severity + '</span>' +
          '</div>' +
          '<div class="path">' + esc(d.path) + '</div>' +
          '<div class="change">' + esc(d.property) + ': ' +
            '<span class="old">' + esc(d.refValue) + '</span> → ' +
            '<span class="new">' + esc(d.dmValue) + '</span>' +
          '</div>' +
        '</div>';
      }
      if (sorted.length > 30) {
        html += '<div class="empty">还有 ' + (sorted.length - 30) + ' 条未显示</div>';
      }
    }

    // 推断特性
    const feats = r.inferred || [];
    html += '<div class="section-title">推断缺失特性 (' + feats.length + ')</div>';
    if (!feats.length) {
      html += '<div class="empty">无</div>';
    } else {
      for (const f of feats) {
        html += '<div class="feat-item">' +
          '<span class="name">' + esc(f) + '</span>' +
          '<span class="stat">已记入学习库</span>' +
        '</div>';
      }
    }

    analyzeResult.innerHTML = html;
  }

  function renderFeatures(msg) {
    const items = msg.items || [];
    let html = '<div class="section-title">特性优先级排行</div>';
    if (!items.length) {
      html += '<div class="empty">暂无特性统计<span class="hint">先分析几个页面</span></div>';
    } else {
      for (const f of items) {
        html += '<div class="feat-item">' +
          '<span class="name">' + esc(f.feature) + '</span>' +
          '<span class="stat">测试 ' + f.tested +
            ' · 失败 ' + f.failed + '</span>' +
          '<span class="priority' + (f.priority === 0 ? ' zero' : '') + '">' +
            f.priority + '</span>' +
        '</div>';
      }
    }
    analyzeResult.innerHTML = html;
  }

  function esc(s) {
    if (s === undefined || s === null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ===== 接收 C++ 消息 =====
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', e => {
      let msg;
      try {
        msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      } catch (err) { return; }
      if (!msg || !msg.type) return;

      if (msg.type === 'aiChunk' && aiChunks[msg.requestId]) {
        aiChunks[msg.requestId](msg.content);
      }
      if (msg.type === 'aiDone' && aiChunks[msg.requestId]) {
        chatHistory.push({ role: 'assistant', content: msg.full || '' });
        aiChunks[msg.requestId](null);
      }
      if (msg.type === 'aiError') {
        appendChat('error', 'AI 错误: ' + msg.error);
        if (msg.requestId && aiChunks[msg.requestId]) aiChunks[msg.requestId](null);
      }
      if (msg.type === 'ollamaStatus') {
        const el = $('status');
        el.textContent = 'Ollama: ' + msg.status;
        el.className = 'status ' + (msg.ok ? 'ok' : 'err');
      }
      if (msg.type === 'modelList') {
        modelSelect.innerHTML = '';
        for (const m of msg.models) {
          const opt = document.createElement('option');
          opt.value = m; opt.textContent = m;
          if (m === localStorage.getItem('ollamaModel')) opt.selected = true;
          modelSelect.appendChild(opt);
        }
      }
      if (msg.type === 'auditList') {
        const list = $('privacyList');
        if (!msg.items || !msg.items.length) {
          list.innerHTML =
            '<div class="empty">暂无审计记录' +
            '<span class="hint">隐私仪表板开发中</span></div>';
        } else {
          list.innerHTML = '';
          msg.items.forEach(it => {
            const el = document.createElement('div');
            el.className = 'list-item';
            el.innerHTML = '<div class="title">' + it.endpoint + '.' + it.method + '</div>' +
                           '<div class="url">' + it.pluginId + ' → ' + it.result + '</div>';
            list.appendChild(el);
          });
        }
      }
      if (msg.type === 'historyList') {
        const list = $('historyList');
        if (!msg.items || !msg.items.length) {
          list.innerHTML = '<div class="empty">暂无历史记录</div>';
        } else {
          list.innerHTML = '';
          msg.items.forEach(it => {
            const el = document.createElement('div');
            el.className = 'list-item';
            el.innerHTML = '<div class="title">' + (it.title || it.url) + '</div>' +
                           '<div class="url">' + it.url + '</div>';
            el.onclick = () => send({ type: 'navigate', url: it.url });
            list.appendChild(el);
          });
        }
      }
      if (msg.type === 'analyzeResult') {
        renderAnalyzeResult(msg);
      }
      if (msg.type === 'featuresList') {
        renderFeatures(msg);
      }
      if (msg.type === 'analyzeSaved') {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = '分析本页';
        analyzeResult.innerHTML =
          '<div class="saved-tip">' +
            '<span class="icon">✓</span>' +
            '已保存为参考（' + msg.nodes + ' 节点）' +
            '<span class="hint">下次点「分析本页」将与此快照对比</span>' +
          '</div>';
      }
      if (msg.type === 'analyzeError') {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = '分析本页';
        analyzeResult.innerHTML =
          '<div class="empty" style="color:#c0392b">分析失败: ' +
          esc(msg.error) + '</div>';
      }
    });
  }

  // ===== 启动：等 chrome.webview 就绪后检测 Ollama =====
  function tryCheckOllama(retries) {
    if (window.chrome && window.chrome.webview) {
      console.log('[Sidebar] chrome.webview 就绪，发送 checkOllama');
      send({ type: 'checkOllama' });
    } else if (retries > 0) {
      setTimeout(() => tryCheckOllama(retries - 1), 200);
    } else {
      console.error('[Sidebar] chrome.webview 未就绪，放弃');
    }
  }
  tryCheckOllama(15);
</script>
</body>
</html>
