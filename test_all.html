<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: "Microsoft YaHei"; }
  .box { width: 50%; padding: 20px; background: #eef; box-sizing: border-box; }
  .center { text-align: center; font-weight: bold; line-height: 2; }
  .grid { display: grid; padding: 10px; }
  .grid > div { background: #dfd; padding: 8px; }
  .flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .flex > span { background: #fdd; padding: 5px; margin: 3px; }
  .abs { position: absolute; top: 10px; left: 10px; width: 100px; }
  .round { border-radius: 12px; background: #4a90e2; width: 100px; height: 60px; }
  .hidden { overflow: hidden; width: 80px; height: 40px; background: #fc9; }
  .z1 { z-index: 1; background: #f00; width: 60px; height: 60px; }
  .z2 { z-index: 10; background: #0f0; width: 60px; height: 60px; margin-top: -30px; }
</style>
</head>
<body>
  <div class="box">
    <p class="center">居中加粗</p>
    <p>第二段 line-height 2</p>
  </div>
  <div class="grid">
    <div>1</div><div>2</div><div>3</div>
    <div>4</div><div>5</div>
  </div>
  <div class="flex">
    <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span>
  </div>
  <div class="round"></div>
  <div class="hidden">
    这段文字会被裁剪，只显示第一行的一部分内容测试 overflow hidden 效果。
  </div>
  <div class="z1"></div>
  <div class="z2"></div>
</body>
</html>
