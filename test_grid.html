<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: "Microsoft YaHei"; }
  .g1 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .g1 > div { background: #dfd; padding: 10px; }
  .g2 { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 5px; }
  .g2 > div { background: #fdd; padding: 10px; }
  .g3 { display: grid; grid-template-columns: 200px 1fr; gap: 8px; }
  .g3 > div { background: #ddf; padding: 10px; }
</style>
</head>
<body>
  <div class="g1">
    <div>1</div><div>2</div><div>3</div><div>4</div>
    <div>5</div><div>6</div><div>7</div><div>8</div>
  </div>
  <div class="g2">
    <div>A</div><div>B</div><div>C</div>
    <div>D</div><div>E</div><div>F</div>
  </div>
  <div class="g3">
    <div>X</div><div>Y</div>
    <div>Z</div><div>W</div>
  </div>
</body>
</html>
